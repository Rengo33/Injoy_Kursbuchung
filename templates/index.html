<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏋️ Injoy Kursplan</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        header p {
            font-size: 1.2em;
            opacity: 0.9;
        }

        .controls {
            background: white;
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }

        .controls h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 1.3em;
        }

        .control-row {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            align-items: center;
            margin-bottom: 20px;
        }

        .control-group {
            flex: 1;
            min-width: 200px;
        }

        .control-group label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 600;
        }

        select, button {
            width: 100%;
            padding: 15px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 1.1em;
            transition: all 0.3s ease;
        }

        select:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-discord {
            background: #5865F2;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-discord:hover {
            background: #4752c4;
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(88, 101, 242, 0.4);
        }

        .kurse-container {
            background: white;
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }

        .status {
            text-align: center;
            padding: 40px;
            color: #888;
        }

        .status.loading {
            color: #667eea;
        }

        .status.error {
            color: #e74c3c;
        }

        .spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .tag-gruppe {
            margin-bottom: 25px;
        }

        .tag-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 20px;
            border-radius: 12px;
            margin-bottom: 15px;
            font-weight: bold;
            font-size: 1.1em;
        }

        .kurs-karte {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 18px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 20px;
            transition: all 0.3s ease;
            border-left: 4px solid #667eea;
        }

        .kurs-karte:hover {
            transform: translateX(5px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .kurs-zeit {
            background: #667eea;
            color: white;
            padding: 10px 15px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 1.2em;
            min-width: 80px;
            text-align: center;
        }

        .kurs-info {
            flex: 1;
        }

        .kurs-name {
            font-weight: bold;
            color: #333;
            font-size: 1.15em;
            margin-bottom: 5px;
        }

        .kurs-details {
            color: #666;
            font-size: 0.95em;
        }

        .kurs-details span {
            margin-right: 15px;
        }

        .kurs-plaetze {
            background: #e8f5e9;
            color: #2e7d32;
            padding: 8px 15px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.9em;
        }

        .kurs-plaetze.wenig {
            background: #fff3e0;
            color: #e65100;
        }

        .kurs-plaetze.voll {
            background: #ffebee;
            color: #c62828;
        }

        .btn-buchen {
            background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.85em;
            transition: all 0.3s ease;
        }

        .btn-buchen:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(76, 175, 80, 0.4);
        }

        .btn-buchen:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .btn-buchen.warteliste {
            background: linear-gradient(135deg, #ff9800 0%, #f57c00 100%);
        }

        .btn-buchen.warteliste:hover {
            box-shadow: 0 5px 15px rgba(255, 152, 0, 0.4);
        }

        .kurs-stats {
            display: flex;
            flex-direction: column;
            gap: 4px;
            align-items: flex-end;
        }

        .kurs-warteliste {
            background: #fff3e0;
            color: #e65100;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.8em;
            font-weight: 600;
        }

        /* Modal Styles */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: white;
            border-radius: 20px;
            padding: 30px;
            max-width: 500px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .modal h2 {
            color: #667eea;
            margin-bottom: 20px;
            text-align: center;
        }

        .modal-kurs-info {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
            border-left: 4px solid #667eea;
        }

        .modal-kurs-info strong {
            color: #333;
            font-size: 1.1em;
        }

        .modal-kurs-info p {
            color: #666;
            margin-top: 5px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-weight: 600;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .form-group input.error {
            border-color: #e74c3c;
        }

        .form-row {
            display: flex;
            gap: 15px;
        }

        .form-row .form-group {
            flex: 1;
        }

        .modal-buttons {
            display: flex;
            gap: 15px;
            margin-top: 25px;
        }

        .modal-buttons button {
            flex: 1;
            padding: 15px;
            border-radius: 12px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-cancel {
            background: #f0f0f0;
            color: #666;
            border: none;
        }

        .btn-cancel:hover {
            background: #e0e0e0;
        }

        .btn-submit {
            background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%);
            color: white;
            border: none;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(76, 175, 80, 0.4);
        }

        .btn-submit:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .btn-submit.warteliste-btn {
            background: linear-gradient(135deg, #ff9800 0%, #f57c00 100%);
        }

        .btn-submit.warteliste-btn:hover {
            box-shadow: 0 5px 20px rgba(255, 152, 0, 0.4);
        }

        .erfolg-nachricht {
            background: #e8f5e9;
            color: #2e7d32;
            padding: 15px 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            text-align: center;
            font-weight: 600;
        }

        .fehler-nachricht {
            background: #ffebee;
            color: #c62828;
            padding: 15px 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            text-align: center;
            font-weight: 600;
        }

        .anzahl-badge {
            background: #667eea;
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9em;
            margin-left: 10px;
        }

        footer {
            text-align: center;
            color: rgba(255,255,255,0.8);
            margin-top: 30px;
            padding: 20px;
        }

        /* Responsive Design */
        @media (max-width: 600px) {
            header h1 {
                font-size: 1.8em;
            }

            .control-row {
                flex-direction: column;
            }

            .control-group {
                width: 100%;
            }

            .kurs-karte {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }

            .kurs-zeit {
                width: 100%;
            }

            .kurs-plaetze {
                align-self: flex-start;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🏋️ Injoy Kursplan</h1>
            <p>Finde deinen nächsten Kurs!</p>
        </header>

        <div class="controls">
            <h2>⚙️ Einstellungen</h2>
            <div class="control-row">
                <div class="control-group">
                    <label for="start">Zeitraum ab:</label>
                    <select id="start">
                        <option value="0">Heute</option>
                        <option value="1" selected>Morgen</option>
                        <option value="2">Übermorgen</option>
                    </select>
                </div>
                <div class="control-group">
                    <label for="tage">Wie viele Tage?</label>
                    <select id="tage">
                        <option value="3">3 Tage</option>
                        <option value="7" selected>1 Woche</option>
                        <option value="14">2 Wochen</option>
                    </select>
                </div>
            </div>
            <div class="control-row">
                <div class="control-group">
                    <button class="btn-primary" onclick="ladeKurse()">
                        🔄 Kurse laden
                    </button>
                </div>
                <div class="control-group">
                    <button class="btn-discord" onclick="sendeDiscord()">
                        📨 An Discord senden
                    </button>
                </div>
            </div>
            <div id="nachricht"></div>
        </div>

        <div class="kurse-container">
            <h2>
                📋 Verfügbare Kurse
                <span class="anzahl-badge" id="anzahl">0</span>
            </h2>
            <div id="kurse-liste">
                <div class="status">
                    Klicke auf "Kurse laden" um die Kurse anzuzeigen 👆
                </div>
            </div>
        </div>

        <footer>
            <p>💜 Mit Liebe für Mama erstellt</p>
        </footer>
    </div>

    <!-- Buchungs-Modal -->
    <div class="modal-overlay" id="buchungsModal">
        <div class="modal">
            <h2>🎫 Kurs buchen</h2>
            <div class="modal-kurs-info" id="modalKursInfo">
                <strong id="modalKursName">Kursname</strong>
                <p id="modalKursDetails">Details</p>
            </div>
            <form id="buchungsForm">
                <input type="hidden" id="courseId">
                <input type="hidden" id="courseDate">
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="vorname">Vorname *</label>
                        <input type="text" id="vorname" required placeholder="Dein Vorname">
                    </div>
                    <div class="form-group">
                        <label for="nachname">Nachname *</label>
                        <input type="text" id="nachname" required placeholder="Dein Nachname">
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="email">E-Mail *</label>
                    <input type="email" id="email" required placeholder="deine@email.de">
                </div>
                
                <div class="form-group">
                    <label for="telefon">Telefon (optional)</label>
                    <input type="tel" id="telefon" placeholder="0151 12345678">
                </div>
                
                <div class="form-group">
                    <label for="notiz">Notiz (optional)</label>
                    <input type="text" id="notiz" placeholder="Zusätzliche Anmerkungen">
                </div>
                
                <div id="buchungsNachricht"></div>
                
                <div class="modal-buttons">
                    <button type="button" class="btn-cancel" onclick="schliesseModal()">Abbrechen</button>
                    <button type="submit" class="btn-submit" id="submitBtn">✅ Jetzt buchen</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Kurse beim Laden der Seite automatisch laden
        document.addEventListener('DOMContentLoaded', function() {
            ladeKurse();
        });

        async function ladeKurse() {
            const liste = document.getElementById('kurse-liste');
            const anzahlBadge = document.getElementById('anzahl');
            const tage = document.getElementById('tage').value;
            const start = document.getElementById('start').value;

            // Loading anzeigen
            liste.innerHTML = `
                <div class="status loading">
                    <div class="spinner"></div>
                    <p>Kurse werden geladen...</p>
                </div>
            `;

            try {
                const response = await fetch(`/api/kurse?tage=${tage}&start=${start}`);
                const data = await response.json();

                if (!data.success) {
                    throw new Error(data.error || 'Unbekannter Fehler');
                }

                anzahlBadge.textContent = data.anzahl;

                if (data.kurse.length === 0) {
                    liste.innerHTML = `
                        <div class="status">
                            😔 Keine Kurse im gewählten Zeitraum gefunden
                        </div>
                    `;
                    return;
                }

                // Nach Datum gruppieren
                const gruppiert = {};
                data.kurse.forEach(kurs => {
                    const key = `${kurs.wochentag}, ${kurs.datum}`;
                    if (!gruppiert[key]) {
                        gruppiert[key] = [];
                    }
                    gruppiert[key].push(kurs);
                });

                // HTML generieren
                let html = '';
                for (const [tag, kurse] of Object.entries(gruppiert)) {
                    html += `
                        <div class="tag-gruppe">
                            <div class="tag-header">📅 ${tag}</div>
                    `;
                    
                    kurse.forEach(kurs => {
                        let plaetzeClass = '';
                        let plaetzeText = '';
                        let wartelisteText = '';
                        
                        // Verfügbare Plätze anzeigen
                        if (kurs.kapazitaet > 0) {
                            if (kurs.verfuegbar <= 0) {
                                plaetzeClass = 'voll';
                                plaetzeText = `${kurs.gebucht}/${kurs.kapazitaet} (voll)`;
                            } else if (kurs.verfuegbar <= 3) {
                                plaetzeClass = 'wenig';
                                plaetzeText = `${kurs.gebucht}/${kurs.kapazitaet} (${kurs.verfuegbar} frei)`;
                            } else {
                                plaetzeText = `${kurs.gebucht}/${kurs.kapazitaet} (${kurs.verfuegbar} frei)`;
                            }
                        }
                        
                        // Warteliste anzeigen wenn vorhanden
                        if (kurs.warteliste > 0) {
                            wartelisteText = `⏳ ${kurs.warteliste} auf Warteliste`;
                        }

                        const buchungsBtn = kurs.course_id ? 
                            `<button class="btn-buchen${kurs.verfuegbar <= 0 ? ' warteliste' : ''}" onclick="oeffneBuchung(${kurs.course_id}, '${kurs.course_date}', '${kurs.name.replace(/'/g, "\\'")}', '${kurs.wochentag}, ${kurs.datum} um ${kurs.uhrzeit}', ${kurs.verfuegbar <= 0})">${kurs.verfuegbar <= 0 ? 'Warteliste' : 'Buchen'}</button>` : 
                            '';

                        html += `
                            <div class="kurs-karte">
                                <div class="kurs-zeit">${kurs.uhrzeit}</div>
                                <div class="kurs-info">
                                    <div class="kurs-name">${kurs.name}</div>
                                    <div class="kurs-details">
                                        ${kurs.trainer ? `<span>👤 ${kurs.trainer}</span>` : ''}
                                        ${kurs.raum ? `<span>📍 ${kurs.raum}</span>` : ''}
                                    </div>
                                </div>
                                <div class="kurs-stats">
                                    ${plaetzeText ? `<div class="kurs-plaetze ${plaetzeClass}">${plaetzeText}</div>` : ''}
                                    ${wartelisteText ? `<div class="kurs-warteliste">${wartelisteText}</div>` : ''}
                                </div>
                                ${buchungsBtn}
                            </div>
                        `;
                    });

                    html += '</div>';
                }

                liste.innerHTML = html;

            } catch (error) {
                liste.innerHTML = `
                    <div class="status error">
                        ❌ Fehler beim Laden: ${error.message}
                    </div>
                `;
                anzahlBadge.textContent = '0';
            }
        }

        async function sendeDiscord() {
            const nachrichtDiv = document.getElementById('nachricht');
            const tage = document.getElementById('tage').value;

            nachrichtDiv.innerHTML = '<div class="erfolg-nachricht">📤 Wird gesendet...</div>';

            try {
                const response = await fetch('/api/discord', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ tage: parseInt(tage) })
                });

                const data = await response.json();

                if (data.success) {
                    nachrichtDiv.innerHTML = `
                        <div class="erfolg-nachricht">
                            ✅ ${data.message}
                        </div>
                    `;
                } else {
                    throw new Error(data.error || data.message || 'Senden fehlgeschlagen');
                }

            } catch (error) {
                nachrichtDiv.innerHTML = `
                    <div class="fehler-nachricht">
                        ❌ Fehler: ${error.message}
                    </div>
                `;
            }

            // Nachricht nach 5 Sekunden ausblenden
            setTimeout(() => {
                nachrichtDiv.innerHTML = '';
            }, 5000);
        }

        // Buchungs-Funktionen
        function oeffneBuchung(courseId, courseDate, kursName, kursDetails, istWarteliste = false) {
            document.getElementById('courseId').value = courseId;
            document.getElementById('courseDate').value = courseDate;
            document.getElementById('modalKursName').textContent = kursName;
            
            if (istWarteliste) {
                document.getElementById('modalKursDetails').innerHTML = '📅 ' + kursDetails + '<br><span style="color: #e65100; font-weight: bold;">⚠️ Dieser Kurs ist voll - du wirst auf die Warteliste gesetzt</span>';
                document.getElementById('submitBtn').textContent = '📋 Auf Warteliste setzen';
                document.getElementById('submitBtn').classList.add('warteliste-btn');
            } else {
                document.getElementById('modalKursDetails').textContent = '📅 ' + kursDetails;
                document.getElementById('submitBtn').textContent = '✅ Jetzt buchen';
                document.getElementById('submitBtn').classList.remove('warteliste-btn');
            }
            
            document.getElementById('buchungsNachricht').innerHTML = '';
            document.getElementById('buchungsModal').classList.add('active');
        }

        function schliesseModal() {
            document.getElementById('buchungsModal').classList.remove('active');
            document.getElementById('buchungsForm').reset();
            document.getElementById('buchungsNachricht').innerHTML = '';
        }

        // Modal schließen bei Klick außerhalb
        document.getElementById('buchungsModal').addEventListener('click', function(e) {
            if (e.target === this) {
                schliesseModal();
            }
        });

        // ESC-Taste zum Schließen
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                schliesseModal();
            }
        });

        // Buchungsformular absenden
        document.getElementById('buchungsForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const submitBtn = document.getElementById('submitBtn');
            const nachrichtDiv = document.getElementById('buchungsNachricht');
            
            submitBtn.disabled = true;
            submitBtn.textContent = '⏳ Wird gebucht...';
            nachrichtDiv.innerHTML = '';

            const data = {
                course_id: document.getElementById('courseId').value,
                course_date: document.getElementById('courseDate').value,
                vorname: document.getElementById('vorname').value.trim(),
                nachname: document.getElementById('nachname').value.trim(),
                email: document.getElementById('email').value.trim(),
                telefon: document.getElementById('telefon').value.trim(),
                notiz: document.getElementById('notiz').value.trim()
            };

            try {
                const response = await fetch('/api/buchen', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                });

                const result = await response.json();

                if (result.success) {
                    nachrichtDiv.innerHTML = `
                        <div class="erfolg-nachricht">
                            ✅ ${result.message}
                        </div>
                    `;
                    
                    // Nach 2 Sekunden Modal schließen und Kurse neu laden
                    setTimeout(() => {
                        schliesseModal();
                        ladeKurse();
                    }, 2000);
                } else {
                    throw new Error(result.error || result.message || 'Buchung fehlgeschlagen');
                }

            } catch (error) {
                nachrichtDiv.innerHTML = `
                    <div class="fehler-nachricht">
                        ❌ ${error.message}
                    </div>
                `;
                submitBtn.disabled = false;
                submitBtn.textContent = '✅ Jetzt buchen';
            }
        });
    </script>
</body>
</html>
